<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tattsvi - Login Popup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&family=Outfit:wght@300;400;500;600&family=Alexandria:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'Outfit': ['Outfit'],
                        'serif': ['Playfair Display'],
                        'sans': ['Inter'],
                        'Alexandria': ['Alexandria'],
                    }
                }
            }
        }
    </script>
    <style>
        .gold-gradient {
            background: linear-gradient(90deg, #D9BE87 0%, #BE933C 100%);
        }

        .backdrop-blur-custom {
            backdrop-filter: blur(8px);
        }
    </style>
</head>

<body class="bg-[#FDFBF7] font-['Outfit'] min-h-screen flex items-center justify-center p-4">

    <!-- Demo Background Content -->
    <div class="fixed inset-0 z-0">
        <img src="assets/banner_1.png" alt="background" class="w-full h-full object-cover opacity-30">
        <div class="absolute inset-0 bg-black/20"></div>
    </div>

    <!-- Trigger Button -->
    <button id="open-login-btn"
        class="relative z-10 px-8 py-3 bg-white text-[#5C4522] rounded-full font-medium shadow-lg hover:shadow-xl transition-all border border-[#EFE4CD]">
        Show Login Popup
    </button>

    <!-- Login Popup Overlay -->
    <div id="login-popup"
        class="fixed inset-0 z-[100] flex items-center justify-center p-4 transition-all duration-300">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closePopup()"></div>

        <!-- Login Popup Overlay -->
        <div id="login-popup"
            class="fixed inset-0 z-[100] flex items-center justify-center p-4 transition-all duration-300">
            <!-- Backdrop -->
            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closePopup()"></div>

            <!-- Popup Card -->
            <div
                class="relative bg-white w-full max-w-[520px] rounded-[48px] overflow-hidden shadow-2xl px-10 py-12 md:px-14 md:py-16 flex flex-col">
                <!-- Close Button -->
                <button onclick="closePopup()"
                    class="absolute top-10 right-10 text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>

                <!-- Title & Subtitle (Left Aligned) -->
                <div class="mb-10 text-left">
                    <h2 class="text-[36px] md:text-[42px] font-bold text-[#1a1a1a] mb-2 leading-tight">Welcome to
                        Tattsvi</h2>
                    <p class="text-[#808080] text-lg md:text-[20px] font-light leading-[1.4] max-w-[380px]">
                        Sign in to explore our collections and enjoy exclusive updates.
                    </p>
                </div>

                <!-- Form -->
                <div class="w-full space-y-8">
                    <!-- Phone Input Group -->
                    <div
                        class="flex items-center w-full border border-[#dcdcdc] rounded-[12px] h-[68px] transition-all focus-within:border-[#BE933C] p-1">
                        <!-- Country Selector -->
                        <div class="flex items-center gap-2 pl-4 pr-3">
                            <img src="https://flagcdn.com/w40/in.png" alt="IN"
                                class="w-7 h-auto rounded-[2px] shadow-sm">
                            <i class="fa-solid fa-chevron-down text-[12px] text-[#1a1a1a]"></i>
                        </div>
                        <!-- Separator -->
                        <div class="w-[1px] h-8 bg-[#dcdcdc] mx-1"></div>
                        <!-- Input -->
                        <input type="tel" placeholder="Enter Your Mobile Number"
                            class="flex-1 h-full px-4 text-[20px] font-['Outfit'] font-normal outline-none text-[#1a1a1a] placeholder-[#b5b5b5]">
                    </div>

                    <!-- Checkbox -->
                    <label class="flex items-center gap-4 cursor-pointer group">
                        <div class="relative flex items-center">
                            <input type="checkbox"
                                class="peer h-6 w-6 cursor-pointer appearance-none rounded-[6px] border border-[#B5B5B5] transition-all checked:bg-[#BE933C] checked:border-[#BE933C]">
                            <i
                                class="fa-solid fa-check absolute text-[12px] text-white opacity-0 peer-checked:opacity-100 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none"></i>
                        </div>
                        <span class="text-[18px] text-[#333333] font-normal select-none">Notify me about new arrivals &
                            offers</span>
                    </label>

                    <!-- Continue Button (Pill Shaped) -->
                    <button
                        class="bg-[#BE933C] w-full h-[72px] rounded-full text-white font-semibold text-[22px] tracking-wide shadow-sm hover:opacity-95 transition-all flex items-center justify-center">
                        Continue
                    </button>

                    <!-- Legal Text -->
                    <div class="text-center pt-4">
                        <p class="text-[#808080] text-[17px] font-normal leading-relaxed">
                            I accept that I have read & understood your <br>
                            <a href="privacy_policy.html"
                                class="text-[#808080] font-normal underline decoration-[#808080] hover:text-[#BE933C] underline-offset-4">Privacy
                                Policy and T&Cs.</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const popup = document.getElementById('login-popup');
        const openBtn = document.getElementById('open-login-btn');

        function openPopup() {
            popup.classList.remove('hidden');
            popup.classList.add('flex');
            // Prevent scrolling on body
            document.body.style.overflow = 'hidden';
        }

        function closePopup() {
            popup.classList.add('hidden');
            popup.classList.remove('flex');
            // Re-enable scrolling
            document.body.style.overflow = 'auto';
        }

        openBtn.addEventListener('click', openPopup);

        // Initial state
        closePopup();
    </script>
</body>

</html>
